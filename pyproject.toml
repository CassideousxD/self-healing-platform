[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length handled by formatter if needed

[tool.pytest.ini_options]
testpaths = [
    "services/auth/tests",
    "services/api/tests",
    "services/worker/tests",
]
pythonpath = [
    ".",
]
