name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "deploy/**"
      - "monitoring/**"
      - "infra/**"
      - "scripts/**"
      - "docs/**"

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff
        run: ruff check .

      - name: Validate Kustomize overlays
        run: |
          for overlay in dev prod; do
            echo "Validating deploy/overlays/${overlay}..."
            rendered=$(kustomize build "deploy/overlays/${overlay}")
            if echo "$rendered" | grep -E 'image:\s*(api|auth|worker|frontend|controller)(\s*|$)'; then
              echo "::error::Bare image name detected in deploy/overlays/${overlay}"
              exit 1
            fi
          done
          echo "All overlays rendered successfully with no bare images."

      - name: Validate monitoring config
        run: |
          echo "Validating monitoring/config..."
          kustomize build monitoring/config > /dev/null
          echo "monitoring/config rendered successfully."

  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: auth
            dir: services/auth
          - service: api
            dir: services/api
          - service: worker
            dir: services/worker
          - service: controller
            dir: controller
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.dir }}/requirements.txt pytest httpx

      - name: Run Pytest
        run: pytest ${{ matrix.dir }}/tests

  build:
    name: build (${{ matrix.service }})
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: auth
            dir: services/auth
          - service: api
            dir: services/api
          - service: worker
            dir: services/worker
          - service: frontend
            dir: services/frontend
          - service: controller
            dir: controller
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository owner
        id: repo_owner
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.dir }}
          platforms: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'type=gha,mode=max' || '' }}

  bump-tag:
    name: bump-tag
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITOPS_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Lowercase repository owner
        id: repo_owner
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update image tags in dev overlay
        run: |
          cd deploy/overlays/dev
          kustomize edit set image \
            auth=ghcr.io/${{ steps.repo_owner.outputs.owner }}/auth:${{ github.sha }} \
            api=ghcr.io/${{ steps.repo_owner.outputs.owner }}/api:${{ github.sha }} \
            worker=ghcr.io/${{ steps.repo_owner.outputs.owner }}/worker:${{ github.sha }} \
            frontend=ghcr.io/${{ steps.repo_owner.outputs.owner }}/frontend:${{ github.sha }} \
            controller=ghcr.io/${{ steps.repo_owner.outputs.owner }}/controller:${{ github.sha }}

      - name: Verify dev overlay image tags
        run: |
          MATCH_COUNT=$(kustomize build deploy/overlays/dev | grep -c -E "image:\s*ghcr\.io/${{ steps.repo_owner.outputs.owner }}/(auth|api|worker|frontend|controller):${{ github.sha }}" || true)
          if [ "$MATCH_COUNT" -ne 5 ]; then
            echo "::error::Expected 5 images matching ghcr.io/${{ steps.repo_owner.outputs.owner }}/(auth|api|worker|frontend|controller):${{ github.sha }}, but found ${MATCH_COUNT}"
            kustomize build deploy/overlays/dev | grep "image:"
            exit 1
          fi
          echo "Verified dev overlay: exactly 5 images match expected SHA ${{ github.sha }}"

      - name: Commit and push tag bump
        run: |
          git add deploy/overlays/dev/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(deploy): bump dev images to ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push origin main

