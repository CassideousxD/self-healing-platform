apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform

resources:
  - namespace.yaml
  - secret.yaml
  - redis.yaml
  - auth.yaml
  - api.yaml
  - worker.yaml
  - frontend.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: controller-policy
    files:
      - policy.yaml
